.note{border-color:rgba(225,29,46,.5);background:var(--t-pink)}
.login{max-width:540px;margin:5vh auto}.login h1{font-size:clamp(38px,6vw,56px);margin:8px 0 6px;letter-spacing:-.03em;line-height:1}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 18px}
.role{all:unset;box-sizing:border-box;cursor:pointer;padding:22px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 var(--hi);transition:.18s}
.role b{font-size:19px;font-weight:800}.role span{font-size:13px;line-height:1.4;color:var(--mute)}
.role:hover{transform:translateY(-2px)}.role:focus-visible{outline:2px solid var(--acc)}
.role.on{border-color:var(--acc);background:var(--glass-h);box-shadow:0 0 0 3px rgba(225,29,46,.2),0 18px 36px -16px var(--glow)}
@media(max-width:560px){.roles{grid-template-columns:1fr}}
.brand{gap:12px;letter-spacing:0;min-width:0}
.brand .logo{flex:0 0 42px;width:42px;height:42px;overflow:hidden;font-family:Syne,system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:-.04em;line-height:1}
.brand-copy{min-width:0;line-height:1.2;letter-spacing:.14em;white-space:nowrap}
.brand-copy small{margin-top:4px;letter-spacing:.12em}
@media(max-width:760px){.brand{width:auto;flex:1 0 100%;gap:12px}.brand .logo{flex-basis:42px}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><div class="logo" aria-hidden="true">USC</div><div class="brand-copy"><span>UBUNYE</span><small>CMS ADMIN</small></div></div>
 <div id="nav"></div>
 <div class="sp"></div>
 <div id="who" style="margin:0 10px 10px;color:#CBD5E1;font-size:13px"></div><button class="btn s" id="out" style="margin:0 8px 8px">Sign out</button>
 <button class="btn s" id="theme" style="margin:0 8px 8px">Toggle theme</button>
 <a href="https://ubunye.weybrand.co.za/index.html" target="_blank" rel="noopener">← View website</a>
</aside>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="ubunye-admin-v1";
const DEF={
 content:{heroKicker:"Safety • Compliance • Confidence",heroTitle:"UBUNYE",
  heroText:"UBUNYE Safety & Compliance provides safety training in Eastern Cape, Limpopo and Mpumalanga, and consulting, ISO and OHS compliance services in the Eastern Cape.",
  ctaPrimary:"Get quote",ctaSecondary:"Explore services",
  faq:[
   {q:"Which services are available in the Eastern Cape?",a:"Nolan provides training, consulting, ISO support, OHS compliance audits and wider SHEQ services in the Eastern Cape."},
   {q:"Who provides training in Limpopo and Mpumalanga?",a:"Mick provides training courses only in Limpopo and Mpumalanga. Call 060 949 9911 to discuss arrangements."},
   {q:"Which training courses are available?",a:"First Aid Level 1, Fire Fighting, OHS SHE Representative, Legal Liability, Working at Heights and Incident Investigations. Contact UBUNYE to arrange training; the online platform is not live yet."},
   {q:"Who awards ISO certification?",a:"Certification is awarded by an independent certification body. Nolan provides ISO 9001, ISO 14001 and ISO 45001 support in the Eastern Cape."}]},
 services:[
  {t:"SHEQ consulting",d:"Safety, health, environment and quality guidance that connects your policies, people and day-to-day operations.",v:true},
  {t:"OHS compliance",d:"Compliance reviews, OHS audits, gap identification, documentation support and practical action planning.",v:true},
  {t:"ISO consulting",d:"Support for ISO 9001, ISO 14001 and ISO 45001: gap analysis, documentation, implementation and readiness.",v:true},
  {t:"Risk assessments",d:"Hazard identification, risk rating and practical controls, recorded in a clear written assessment.",v:true},
  {t:"Safety files",d:"Preparation and review of organised health and safety files that show how your business manages safety.",v:true},
  {t:"Safety training",d:"Training support designed around your workforce, your risks and your operational needs.",v:true},
  {t:"Incident investigation",d:"Independent support to establish what happened, why it happened and what needs to change.",v:true}],
 courses:[
  {t:"First Aid Level 1",v:true},{t:"Fire Fighting",v:true},{t:"OHS SHE Representative",v:true},
  {t:"Legal Liability",v:true},{t:"Working at Heights",v:true},{t:"Incident Investigations",v:true}],
 proof:[
  {t:"Client testimonial",d:"Verified client feedback will be inserted here once supplied and approved.",ok:false,pub:false},
  {t:"Case study framework",d:"Placeholder only; no client case study is published.",ok:false,pub:false}],
 settings:{email:"ubunyesafety@gmail.com",phone:"083 646 7294",mickPhone:"060 949 9911",whatsapp:"067 577 9148",provinces:"Eastern Cape, Limpopo, Mpumalanga",title:"UBUNYE Safety & Compliance | SHEQ, OHS & ISO Consulting South Africa",analytics:"",maint:false}
};
let S=JSON.parse(JSON.stringify(DEF)),PW=sessionStorage.getItem("ua-pw")||"",ROLE=sessionStorage.getItem("ua-role")||"";
async function api(m,b){const r=await fetch("/admin/api/data",{method:m,headers:{"content-type":"application/json",authorization:"Bearer "+PW,"x-role":ROLE},body:b?JSON.stringify(b):undefined});const data=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(data.error||"The admin request failed."),{status:r.status});return data}
let _t;const save=m=>{clearTimeout(_t);_t=setTimeout(()=>api("PUT",S).then(()=>toast(m||"Saved")).catch(e=>toast(e.message||"Save failed - try again")),250)};
async function boot(){if(!ROLE||!PW)return login("");try{S=await api("GET");$("who").textContent="Signed in: "+ROLES[ROLE][0];render()}catch(e){login(e.status===401?"Wrong password.":e.message||"Could not reach the server.")}}
const ROLES={dev:["Wey Developer","Full access, including SEO, analytics and maintenance mode."],director:["USC Director","Manage homepage content, services, courses, proof and contact details."]};
function login(msg){let r=ROLE||"director";nav();$("who").textContent="";
 const draw=()=>{$("main").innerHTML=`<div class="login"><div class="eyebrow">Ubunye CMS</div><h1>Sign in</h1><div class="mute">Choose how you are signing in.</div>
 <div class="roles">${Object.entries(ROLES).map(([k,[n,d]])=>`<button class="role ${k===r?"on":""}" data-r="${k}"><b>${n}</b><span>${d}</span></button>`).join("")}</div>
 <div class="card"><label class="f">Password for ${ROLES[r][0]}<input type="password" id="pw" autocomplete="current-password"></label><div class="mute" style="min-height:24px;color:var(--acc)">${msg}</div><button class="btn p" id="go">Sign in as ${ROLES[r][0]}</button></div></div>`;
 q("[data-r]",b=>b.onclick=()=>{r=b.dataset.r;msg="";draw()});
 const go=()=>{PW=$("pw").value;ROLE=r;sessionStorage.setItem("ua-pw",PW);sessionStorage.setItem("ua-role",r);boot()};
 $("go").onclick=go;$("pw").onkeydown=e=>{if(e.key==="Enter")go()};$("pw").focus()};draw()}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS=[["overview","Overview"],["content","Page content"],["services","Services"],["courses","Training courses"],["proof","Case studies & proof"],["settings","Site settings"]];
let tab="overview";
const $=id=>document.getElementById(id);
const TK=["COIDA","OHS ACT","ISO 45001","SHEQ retainers","Safety training","Risk management"].map(x=>`<span>${x}</span>`).join("");
const IC={overview:'<path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',content:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/>',services:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5" />',courses:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',proof:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
function nav(){$("nav").innerHTML=TABS.map(([k,n])=>`<button class="nav ${k===tab?"on":""}" data-t="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${n}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function head(e,t,sub){return `<div class="top"><div><div class="eyebrow">${e}</div><h1>${t}</h1>${sub?`<div class="mute">${sub}</div>`:""}</div></div>`}

const V={
overview(){const live=S.services.filter(s=>s.v).length,pend=S.proof.filter(p=>!p.ok).length;
 return `<div class="hero"><div class="eyebrow">Safety • Compliance • Confidence</div><h1>Control centre.</h1><p>Manage everything that appears on ubunye.weybrand.co.za from one place.</p>
 <div class="acts"><button class="btn p" onclick="tab='services';render()">Manage services</button><a class="btn" href="https://ubunye.weybrand.co.za/index.html" target="_blank" rel="noopener">View website ↗</a></div><span class="chip c1">ASSESS</span><span class="chip c2">CONTROL</span><span class="chip c3">TRAIN</span><span class="chip c4">IMPROVE</span></div>`+
 `<div class="ticker"><div class="tr">${TK}${TK}</div></div>`+
 (S.settings.maint?`<div class="note"><b>Maintenance mode is ON.</b> Visitors would see a holding page.</div>`:"")+
 `<div class="grid">
 <div class="card stat pink"><span class="lbl">PUBLIC PAGES</span><b>17</b><span class="mute">Service, company and legal pages.</span></div>
 <div class="card stat mint"><span class="lbl">LIVE SERVICES</span><b>${live}/${S.services.length}</b><span class="mute">Visible on the website.</span></div>
 <div class="card stat blue"><span class="lbl">LIVE COURSES</span><b>${S.courses.filter(c=>c.v).length}/${S.courses.length}</b><span class="mute">Visible on the training page.</span></div>
 <div class="card stat blue"><span class="lbl">PROOF AWAITING</span><b>${pend}</b><span class="mute">Items not yet verified.</span></div>
 <div class="card stat gold"><span class="lbl">CONTACT ROUTES</span><b>4</b><span class="mute">Nolan, Mick, WhatsApp and email.</span></div></div>
 <div class="card"><h3>Lead routes</h3>
 <div class="row"><div class="g"><b>Quote form</b><div class="mute">Frontend demo only; enquiries are not sent or stored.</div></div><span class="tag wait">DEMO</span></div>
 <div class="row"><div class="g"><b>WhatsApp</b><div class="mute">${esc(S.settings.whatsapp)}</div></div><span class="tag ok">ACTIVE</span></div>
 <div class="row"><div class="g"><b>Nolan · Eastern Cape</b><div class="mute">${esc(S.settings.phone)} · training, consulting, ISO and OHS compliance</div></div><span class="tag ok">ACTIVE</span></div>
 <div class="row"><div class="g"><b>Mick · Limpopo &amp; Mpumalanga</b><div class="mute">${esc(S.settings.mickPhone)} · training courses only</div></div><span class="tag ok">ACTIVE</span></div>
 <div class="row"><div class="g"><b>Email</b><div class="mute">${esc(S.settings.email)}</div></div><span class="tag ok">ACTIVE</span></div></div>`},

content(){const c=S.content;
 return head("Page content","Homepage","Manage the homepage introduction and its FAQ.")+
 `<div class="card" style="margin-bottom:18px"><h3>Hero</h3><br>
 ${[["heroKicker","Kicker"],["heroTitle","Heading"],["ctaPrimary","Primary button"],["ctaSecondary","Secondary button"]].map(([k,l])=>`<label class="f">${l}<input type="text" data-c="${k}" value="${esc(c[k])}"></label>`).join("")}
 <label class="f">Intro text<textarea data-c="heroText">${esc(c.heroText)}</textarea></label>
 <button class="btn p" id="saveC">Save hero</button></div>
 <div class="card"><div class="row" style="border:0;padding-top:0"><h3 class="g">FAQ</h3><button class="btn s" id="addQ">+ Add question</button></div>
 ${c.faq.map((f,i)=>`<div class="row"><div class="g"><b>${esc(f.q)}</b><div class="mute">${esc(f.a)}</div></div><button class="btn s" data-eq="${i}">Edit</button><button class="btn s d" data-dq="${i}">Delete</button></div>`).join("")}</div>`},

services(){return head("Service management","Homepage services","Toggle visibility, reorder and edit the service cards shown on the homepage.")+
 `<div class="card"><div class="row" style="border:0;padding-top:0"><span class="g mute">${S.services.length} services</span><button class="btn p s" id="addS">+ Add service</button></div>
 ${S.services.map((s,i)=>`<div class="row"><label class="sw"><input type="checkbox" data-vs="${i}" ${s.v?"checked":""}><i></i></label>
 <div class="g"><b>${esc(s.t)}</b><div class="mute">${esc(s.d)}</div></div>
 <button class="btn s" data-up="${i}" ${i?"":"disabled"}>↑</button><button class="btn s" data-dn="${i}" ${i<S.services.length-1?"":"disabled"}>↓</button>
 <button class="btn s" data-es="${i}">Edit</button><button class="btn s d" data-ds="${i}">Delete</button></div>`).join("")}</div>`},

courses(){return head("Training management","Training courses","Manage the course cards shown on the safety training page. SAIOSH evidence files are read-only.")+
 `<div class="card"><div class="row" style="border:0;padding-top:0"><span class="g mute">${S.courses.length} courses</span><button class="btn p s" id="addCourse">+ Add course</button></div>
 ${S.courses.map((course,i)=>`<div class="row"><label class="sw"><input type="checkbox" data-vcourse="${i}" ${course.v?"checked":""}><i></i></label>
 <div class="g"><b>${esc(course.t)}</b><div class="mute">${course.v?"Shown on the public training page.":"Hidden from the public training page."}</div></div>
 <button class="btn s" data-upcourse="${i}" ${i?"":"disabled"}>↑</button><button class="btn s" data-downcourse="${i}" ${i<S.courses.length-1?"":"disabled"}>↓</button>
 <button class="btn s" data-editcourse="${i}">Edit</button><button class="btn s d" data-deletecourse="${i}">Delete</button></div>`).join("")}</div>
 <div class="card" style="margin-top:18px"><h3>Regional delivery</h3><p class="mute">Nolan provides training and wider SHEQ services in the Eastern Cape. Mick provides training courses only in Limpopo and Mpumalanga. Update their contact numbers in Site settings.</p><a class="btn s" href="https://ubunye.weybrand.co.za/services/safety-training" target="_blank" rel="noopener">View training page ↗</a></div>`},

proof(){return head("Verified proof only","Testimonials & case studies","Content can only be published once the client has verified it.")+
 `<div class="card" style="margin-bottom:18px"><h3>SAIOSH membership evidence</h3><p class="mute">Official SAIOSH files are published as supplied. They are not editable or replaceable from this panel.</p>
 <div class="row"><div class="g"><b>Corporate member badge</b></div><a class="btn s" href="https://ubunye.weybrand.co.za/saiosh-corporate-member-badge.jpg" target="_blank" rel="noopener">View file ↗</a></div>
 <div class="row"><div class="g"><b>Corporate membership certificate</b></div><a class="btn s" href="https://ubunye.weybrand.co.za/saiosh-corporate-membership-certificate.jpg" target="_blank" rel="noopener">View image ↗</a><a class="btn s" href="https://ubunye.weybrand.co.za/saiosh-corporate-membership-certificate.pdf" target="_blank" rel="noopener">View PDF ↗</a></div></div>`+
 `<div class="card"><div class="row" style="border:0;padding-top:0"><span class="g mute">${S.proof.length} items</span><button class="btn p s" id="addP">+ Add item</button></div>
 ${S.proof.map((p,i)=>`<div class="row"><div class="g"><b>${esc(p.t)}</b><div class="mute">${esc(p.d)}</div></div>
 <span class="tag ${p.ok?"ok":"wait"}">${p.ok?"VERIFIED":"AWAITING"}</span>
 <label class="mute" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-vp="${i}" ${p.ok?"checked":""}> Verified</label>
 <label class="sw" title="Publish"><input type="checkbox" data-pp="${i}" ${p.pub?"checked":""} ${p.ok?"":"disabled"}><i></i></label>
 <button class="btn s" data-ep="${i}">Edit</button><button class="btn s d" data-dp="${i}">Delete</button></div>`).join("")}</div>`},

settings(){const s=S.settings;
 return head("Site settings","Contact details","Contact channels and regional course coverage.")+
 `<div class="card">${[["email","Email"],["phone","Nolan · Eastern Cape"],["mickPhone","Mick · Limpopo & Mpumalanga (training only)"],["whatsapp","WhatsApp"],["provinces","Regions (overview)"],["title","SEO title"],["analytics","Analytics ID"]].filter(([k])=>ROLE==="dev"||!["title","analytics"].includes(k)).map(([k,l])=>`<label class="f">${l}<input type="text" data-s="${k}" value="${esc(s[k])}"></label>`).join("")}
 ${ROLE==="dev"?`<div class="row"><div class="g"><b>Maintenance mode</b><div class="mute">Show a holding page to visitors.</div></div><label class="sw"><input type="checkbox" id="maint" ${s.maint?"checked":""}><i></i></label></div>`:""}
 <br><button class="btn p" id="saveS">Save settings</button></div>`}
};

// modal-free editing via prompt-like inline dialog
function dlg(title,fields,vals,done){
 const d=document.createElement("dialog");
 d.style.cssText="border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:22px;width:min(480px,92vw)";
 d.innerHTML=`<h3>${title}</h3><br>${fields.map(([k,l,ta])=>`<label class="f">${l}${ta?`<textarea name="${k}">${esc(vals[k]||"")}</textarea>`:`<input type="text" name="${k}" value="${esc(vals[k]||"")}">`}</label>`).join("")}
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn p" data-ok>Save</button></div>`;
 document.body.appendChild(d);d.showModal();
 const close=()=>{d.close();d.remove()};
 d.querySelector("[data-x]").onclick=close;
 d.querySelector("[data-ok]").onclick=()=>{const o={};d.querySelectorAll("[name]").forEach(e=>o[e.name]=e.value.trim());if(Object.values(o)[0]){done(o);close()}};
}
const q=(s,f)=>document.querySelectorAll(s).forEach(f);
function bind(){
 if(tab==="content"){
  $("saveC").onclick=()=>{q("[data-c]",e=>S.content[e.dataset.c]=e.value);save("Hero saved")};
  $("addQ").onclick=()=>dlg("New question",[["q","Question"],["a","Answer",1]],{},o=>{S.content.faq.push(o);save();render()});
  q("[data-eq]",b=>b.onclick=()=>{const i=+b.dataset.eq;dlg("Edit question",[["q","Question"],["a","Answer",1]],S.content.faq[i],o=>{S.content.faq[i]=o;save();render()})});
  q("[data-dq]",b=>b.onclick=()=>{S.content.faq.splice(+b.dataset.dq,1);save("Deleted");render()});
 }
 if(tab==="services"){
  const L=S.services,F=[["t","Title"],["d","Description",1]];
  $("addS").onclick=()=>dlg("New service",F,{},o=>{L.push({...o,v:true});save();render()});
  q("[data-vs]",e=>e.onchange=()=>{L[+e.dataset.vs].v=e.checked;save()});
  q("[data-es]",b=>b.onclick=()=>{const i=+b.dataset.es;dlg("Edit service",F,L[i],o=>{Object.assign(L[i],o);save();render()})});
  q("[data-ds]",b=>b.onclick=()=>{L.splice(+b.dataset.ds,1);save("Deleted");render()});
  q("[data-up]",b=>b.onclick=()=>{const i=+b.dataset.up;[L[i-1],L[i]]=[L[i],L[i-1]];save();render()});
  q("[data-dn]",b=>b.onclick=()=>{const i=+b.dataset.dn;[L[i+1],L[i]]=[L[i],L[i+1]];save();render()});
 }
 if(tab==="courses"){
  const L=S.courses,F=[["t","Course title"]];
  $("addCourse").onclick=()=>dlg("New training course",F,{},o=>{L.push({...o,v:true});save();render()});
  q("[data-vcourse]",e=>e.onchange=()=>{L[+e.dataset.vcourse].v=e.checked;save()});
  q("[data-editcourse]",b=>b.onclick=()=>{const i=+b.dataset.editcourse;dlg("Edit training course",F,L[i],o=>{Object.assign(L[i],o);save();render()})});
  q("[data-deletecourse]",b=>b.onclick=()=>{L.splice(+b.dataset.deletecourse,1);save("Deleted");render()});
  q("[data-upcourse]",b=>b.onclick=()=>{const i=+b.dataset.upcourse;[L[i-1],L[i]]=[L[i],L[i-1]];save();render()});
  q("[data-downcourse]",b=>b.onclick=()=>{const i=+b.dataset.downcourse;[L[i+1],L[i]]=[L[i],L[i+1]];save();render()});
 }
 if(tab==="proof"){
  const L=S.proof,F=[["t","Title"],["d","Details",1]];
  $("addP").onclick=()=>dlg("New proof item",F,{},o=>{L.push({...o,ok:false,pub:false});save();render()});
  q("[data-vp]",e=>e.onchange=()=>{const p=L[+e.dataset.vp];p.ok=e.checked;if(!e.checked)p.pub=false;save();render()});
  q("[data-pp]",e=>e.onchange=()=>{L[+e.dataset.pp].pub=e.checked;save(e.checked?"Published":"Unpublished")});
  q("[data-ep]",b=>b.onclick=()=>{const i=+b.dataset.ep;dlg("Edit item",F,L[i],o=>{Object.assign(L[i],o);save();render()})});
  q("[data-dp]",b=>b.onclick=()=>{L.splice(+b.dataset.dp,1);save("Deleted");render()});
 }
 if(tab==="settings"){
  $("saveS").onclick=()=>{q("[data-s]",e=>S.settings[e.dataset.s]=e.value);if($("maint"))S.settings.maint=$("maint").checked;save("Settings saved")};
 }
}
function render(){nav();$("main").innerHTML=V[tab]();bind();window.scrollTo(0,0)}
$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("out").onclick=()=>{sessionStorage.removeItem("ua-pw");sessionStorage.removeItem("ua-role");PW="";ROLE="";login("")};
boot();
</script>
</body>
</html>
